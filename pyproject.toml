[project]
name = "gbif-data-pipeline"
version = "0.1.0"
description = "A data engineering pipeline for collecting, transforming, and analyzing biodiversity data from the GBIF API."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas>=2.2,<3.0",
    "requests>=2.32,<3.0",
    "jupyter>=1.1,<2.0",
    "duckdb>=1.0,<2.0",
    "pyarrow>=17.0,<22.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "ruff>=0.6,<1.0",
]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"