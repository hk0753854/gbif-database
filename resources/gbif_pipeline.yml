resources:
  jobs:
    gbif_pipeline:
      name: animal-database-gbif-pipeline-${bundle.target}

      parameters:
        - name: scientific_name
          default: Hynobius nebulosus

        - name: limit
          default: "10"

      tasks:
        - task_key: ingest_gbif_to_bronze
          notebook_task:
            notebook_path: ../notebooks/databricks/01_ingest_gbif_to_bronze.py
            base_parameters:
              scientific_name: "{{job.parameters.scientific_name}}"
              limit: "{{job.parameters.limit}}"

        - task_key: transform_bronze_to_silver
          depends_on:
            - task_key: ingest_gbif_to_bronze
          notebook_task:
            notebook_path: ../notebooks/databricks/02_transform_bronze_to_silver.py

        - task_key: create_gold_tables
          depends_on:
            - task_key: transform_bronze_to_silver
          notebook_task:
            notebook_path: ../notebooks/databricks/03_create_gold_tables.py
