resources:
  jobs:
    gbif_pipeline:
      name: gbif-database-gbif-pipeline-${bundle.target}

      parameters:
        - name: limit
          default: "10"

      tasks:
        - task_key: read_species_master
          notebook_task:
            notebook_path: ../notebooks/databricks/04_read_species_master.py

        - task_key: ingest_gbif_to_bronze
          depends_on:
            - task_key: read_species_master
          notebook_task:
            notebook_path: ../notebooks/databricks/01_ingest_gbif_to_bronze.py

        - task_key: transform_bronze_to_silver
          depends_on:
            - task_key: ingest_gbif_to_bronze
          notebook_task:
            notebook_path: ../notebooks/databricks/02_transform_bronze_to_silver.py

        - task_key: create_gold_tables
          depends_on:
            - task_key: transform_bronze_to_silver
          notebook_task:
            notebook_path: ../notebooks/databricks/03_create_gold_tables.py
